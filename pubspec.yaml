name: khoraki
description: "Khoraki - Household Meal and Meal Expense Manager App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1
  firebase_storage: ^12.0.1

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Utilities & UI Components
  intl: ^0.19.0
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#0F766E"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#0F766E"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
